# This is the configuration file for PlatformIO, a cross-platform tool and IDE
# to build and develop software for embedded systems.
#
# For documentation on this file, see:
# - https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
description = HC32F460 grblHAL driver
include_dir = Inc
src_dir = Src
boards_dir = platformio_boards
default_envs = hc32f460_voxelab_aquila_v102
extra_configs = platformio.local.ini

[common]
lib_archive = no
lib_ldf_mode = off
build_flags =
  -I .
  -I Inc
  -I boards
  -I SDK/main
  -I SDK/main/hdsc32core/common
  -I SDK/main/hdsc32core/Include
  -I SDK/drivers/library/inc
  -D HC32F46x
  -D HC32F460
  -D __HC32F460__
  -D __FPU_PRESENT=1
  -D HC32_PLATFORM
  -D _USE_IOCTL=1
  -D _USE_WRITE=1
  -D _VOLUMES=1
  -D ADAPTIVE_MULTI_AXIS_STEP_SMOOTHING=0
  -D SEGMENT_BUFFER_SIZE=10
  -Wl,-u,_printf_float
  -Wl,-u,_scanf_float
  -mcpu=cortex-m4
  -mthumb
  -std=gnu11
  -O2
  -g3
  -ffunction-sections
  -fdata-sections
  -fno-common
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Wno-missing-field-initializers
lib_deps =
  grbl
  sdcard
  keypad
  fans
  odometer
  addons/relays
  addons/spindle_select
  SDK/drivers/library
  SDK/drivers/vendor
lib_extra_dirs =
  .
  SDK/drivers

[env]
platform = ststm32
board = genericHC32F460
framework =
build_flags = ${common.build_flags}
lib_archive = ${common.lib_archive}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = ${common.lib_deps}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.ldscript = ldscripts/hc32f46x_flash.ld
upload_protocol = custom
upload_command = pyocd load $SOURCE -t hc32f460 -a 0xC000

# Voxelab Aquila V1.0.2 mainboard (HC32F460KCTA)
[env:hc32f460_voxelab_aquila_v102]
build_flags =
  ${env.build_flags}
  -D BOARD_VOXELAB_AQUILA_V102
  -D RELAYS_ENABLE=1
  -D FANS_ENABLE=0
  -D N_SPINDLE=2

# Generic HC32F460 target
[env:hc32f460_generic]
build_flags =
  ${env.build_flags}
